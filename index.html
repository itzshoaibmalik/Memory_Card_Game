<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <video autoplay muted loop class="video-background">
        <source src="bgvideo1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div id="particles-js"></div>

    <!-- Audio Elements -->
    <audio id="clickSound" src="music/sound1.mp3" preload="auto"></audio>
    <audio id="matchSound" src="music/match.mp3" preload="auto"></audio>
    <audio id="winSound" src="music/win.mp3" preload="auto"></audio>
    <audio id="backgroundAudio" loop preload="auto"></audio>

    <div class="container">
        <header class="game-header">
            <button id="toggleButton" title="Toggle Music">🔊</button>
            <h1 id="game-title">MEMORY GAME</h1>
            <button id="settingsButton" title="Settings">⚙️</button>
        </header>

        <div id="view-difficulty" class="view active"> 
            <h2 class="difficulty-title"><span>SELECT</span> YOUR <span>CHALLENGE</span></h2>
            <div class="difficulty-options-container">
                <div class="difficulty-card" data-difficulty="easy">
                    <div class="card-content">
                        <h3>Easy</h3>
                        <p class="difficulty-details">4 x 4 Grid</p>
                        <span class="difficulty-icon">🌿</span>
                        <button class="select-btn">Select</button>
                    </div>
                </div>
                <div class="difficulty-card" data-difficulty="medium">
                    <div class="card-content">
                        <h3>Medium</h3>
                        <p class="difficulty-details">5 x 4 Grid</p>
                        <span class="difficulty-icon">⚔️</span>
                        <button class="select-btn">Select</button>
                    </div>
                </div>
                <div class="difficulty-card" data-difficulty="hard">
                    <div class="card-content">
                        <h3>Hard</h3>
                        <p class="difficulty-details">6 x 5 Grid</p>
                        <span class="difficulty-icon">🔥</span>
                        <button class="select-btn">Select</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-game" class="view">
            <div class="status-bar">
                <div id="score" class="status-item">Score: 0</div>
                <div id="moves" class="status-item">Moves: 0</div>
                <div id="timer" class="status-item">Time: 0s</div>
            </div>
            <div class="game-container-wrapper">
                <div class="game-container" id="game-container">
                </div>
            </div>
            <div class="footer-buttons">
                <button id="restart-button">⟳ Restart</button>
                <button id="menu-button">🏠︎ Menu</button>
            </div>
        </div>

        <aside class="settings-panel" id="settingsPanel">
            <button class="close-settings-btn" id="closeSettingsBtn" title="Close Settings">×</button>
            <h3>Settings</h3>

            <div class="settings-section">
                <label for="musicSelect">Background Music:</label>
                <select id="musicSelect">
                    <option value="">-- Select Music --</option>
                    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Epic Adventure</option>
                    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Mystical Journey</option>
                    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Peaceful Mind</option>
                    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3">Game Time</option>
                    <option value="disabled">No Music</option>
                </select>
            </div>

            <div class="settings-section">
                <label for="cardBackSelect">Card Back:</label>
                <select id="cardBackSelect">
                    <option value="img/imagebg.jpg">Default Pattern</option>
                    <!-- Add other options if you create cardback images -->
                    <!-- <option value="img/cardback_blue.jpg">Abstract Blue</option> -->
                </select>
            </div>

            <div class="settings-section">
                <label for="themeSelect">Theme:</label>
                <select id="themeSelect">
                    <option value="theme-default">Neon Abyss</option> 
                    <option value="theme-sunset">Sunset</option>
                </select>
            </div>

            <div class="settings-section profile-section">
                <img src="img/profile1.jpeg" alt="Profile" class="profile-img"
                    onclick="alert('Profile view not implemented')">
                <button class="btn-secondary" onclick="window.location.href='login.html'">Login</button>
                <button class="btn-secondary" onclick="window.location.href='signup.html'">Sign Up</button>
            </div>
        </aside>

        <div class="overlay" id="overlay"></div>

        <div id="gameOverModal" class="modal">
            <div class="modal-content">
                <button class="close-modal-btn" onclick="closeModal()">×</button>
                <h2 id="modalTitle">Game Over!</h2>
                <div class="modal-stats">
                    <p id="modalScore">Score: 0</p>
                    <p id="modalTime">Time Left: 0s</p>
                    <p id="modalMoves">Moves: 0</p>
                </div>
                <hr>
                <div id="leaderboardContainer">
                    <h3>Leaderboard</h3>
                    <div id="leaderboard"></div>
                </div>
                <hr>
                <div class="modal-buttons">
                    <button id="modalRestartBtn">Play Again</button>
                    <button id="modalMenuBtn">Main Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/particles.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
