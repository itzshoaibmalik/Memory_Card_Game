<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Memory Game</title>
    <link rel="stylesheet" href="auth_style.css"> 
</head>
<body>
    <div class="auth-container">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
        <p class="auth-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
        <p class="auth-link"><a href="index.html">Back to Game</a></p>
    </div>
    <script>
         document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Login functionality not implemented in this demo!');
         });
    </script>
</body>
</html>
